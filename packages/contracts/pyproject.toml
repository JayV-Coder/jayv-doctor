[project]
name = "aid-contracts"
version = "0.1.0"
description = "Contratos compartilhados do Integration AI Doctor (Contrato de evento v1)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.25",
    "pydantic>=2.12",
    "rfc3339-validator>=0.1.4",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "python"
