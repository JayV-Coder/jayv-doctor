[project]
name = "aid-api"
version = "0.0.0"
description = "API FastAPI do Integration AI Doctor"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aid-alerts",
    "aid-observability",
    "aid-knowledge",
    "aid-connectors",
    "aid-contracts",
    "aid-correlation",
    "aid-db",
    "aid-security",
    "fastapi>=0.162",
    "opentelemetry-exporter-gcp-monitoring>=1.9.0a0",
    "opentelemetry-exporter-gcp-trace>=1.9",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-sdk>=1.30",
    "asyncpg>=0.30",
    "pyjwt[crypto]>=2.15",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.54",
    "httpx>=0.28",
]

[tool.uv.sources]
aid-alerts = { workspace = true }
aid-observability = { workspace = true }
aid-knowledge = { workspace = true }
aid-connectors = { workspace = true }
aid-contracts = { workspace = true }
aid-correlation = { workspace = true }
aid-db = { workspace = true }
aid-security = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.5,<0.10"]
build-backend = "uv_build"
