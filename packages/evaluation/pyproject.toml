[project]
name = "aid-evaluation"
version = "0.1.0"
description = "Dataset rotulado e harness de avaliação do motor de diagnóstico"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aid-diagnosis-engine",
    "pydantic>=2.9",
]

[tool.uv.sources]
aid-diagnosis-engine = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.5,<0.10"]
build-backend = "uv_build"
