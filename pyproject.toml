# Raiz do workspace uv (não é um pacote). Cada app, worker ou pacote Python
# tem o próprio pyproject.toml e entra em [tool.uv.workspace].members.
[project]
name = "jayv-doctor"
version = "0.0.0"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/agent", "apps/api", "packages/alerts", "packages/connectors", "packages/contracts", "packages/correlation", "packages/db", "packages/diagnosis-engine", "packages/evaluation", "packages/knowledge", "packages/observability", "packages/security", "workers/connectors", "workers/correlation", "workers/diagnosis", "workers/ingestion", "workers/notifier", "workers/relay", "workers/runtime"]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.35",
    "httpx>=0.28",
    "hypothesis>=6.140",
    "import-linter>=2.3",
    "hypothesis-jsonschema>=0.23",
    "mypy>=1.18",
    "types-jsonschema>=4.25",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.0",
    "ruff==0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["supabase", "infrastructure", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "C4", "S", "PT", "RUF", "T20"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
# A suíte de contrato dos Conectores mora em src, para os pacotes de cada conector herdarem.
"packages/connectors/src/aid_connectors/testing.py" = ["S101"]
"scripts/**" = ["T20", "S603", "S607", "S608"]
# CLI da avaliação: imprime o resultado no terminal.
"packages/evaluation/src/aid_evaluation/__main__.py" = ["T20"]
"packages/*/scripts/**" = ["T20", "S603", "S607"]
# Gerado pelo datamodel-codegen; as docstrings vêm das descrições do schema.
"packages/contracts/python/aid_contracts/event_v1.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Nomes de arquivos de teste são únicos no repositório (ex.: test_api_smoke.py),
# porque o mypy trata cada pasta tests/ sem __init__.py como módulos de topo.
files = [
    "packages/alerts/src",
    "packages/alerts/tests",
    "apps/agent/src",
    "apps/agent/tests",
    "apps/api/src",
    "apps/api/tests",
    "packages/connectors/src",
    "packages/connectors/tests",
    "packages/contracts/python",
    "packages/contracts/tests",
    "packages/correlation/src",
    "packages/evaluation/src",
    "packages/evaluation/tests",
    "packages/correlation/tests",
    "packages/diagnosis-engine/src",
    "packages/diagnosis-engine/tests",
    "packages/knowledge/src",
    "packages/knowledge/tests",
    "workers/correlation/src",
    "workers/correlation/tests",
    "workers/diagnosis/src",
    "workers/diagnosis/tests",
    "packages/db/src",
    "packages/observability/src",
    "packages/observability/tests",
    "packages/security/src",
    "packages/security/tests",
    "workers/connectors/src",
    "workers/connectors/tests",
    "workers/ingestion/src",
    "workers/notifier/src",
    "workers/notifier/tests",
    "workers/ingestion/tests",
    "workers/relay/src",
    "workers/relay/tests",
    "workers/runtime/src",
    "workers/runtime/tests",
    "scripts/load_report.py",
    "scripts/db_fingerprint.py",
    "scripts/pilot_report.py",
    "scripts/sus_score.py",
    "tests/operations",
]

# Cada módulo da API só depende de `core`, nunca de outro módulo (ADR-0002).
[tool.importlinter]
root_package = "aid_api"

[[tool.importlinter.contracts]]
name = "Módulos independentes sobre o core"
type = "layers"
layers = ["aid_api.main", "aid_api.health | aid_api.orgs | aid_api.integrations | aid_api.imports | aid_api.ingestion | aid_api.connectors | aid_api.executions | aid_api.incidents | aid_api.dashboard | aid_api.knowledge | aid_api.diagnoses | aid_api.audit | aid_api.privacy | aid_api.usage | aid_api.reports | aid_api.agents | aid_api.alerts | aid_api.webhooks", "aid_api.core"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers"
testpaths = ["apps", "packages", "workers", "tests"]
