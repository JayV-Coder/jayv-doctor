[project]
name = "aid-connector-worker"
version = "0.0.0"
description = "Worker de Conectores: Sincronizações, política de falhas e agendamento"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aid-connectors",
    "aid-db",
    "fastapi>=0.162",
    "sqlalchemy[asyncio]>=2.0",
]

[tool.uv.sources]
aid-connectors = { workspace = true }
aid-db = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.5,<0.10"]
build-backend = "uv_build"
