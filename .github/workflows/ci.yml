name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test

  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      # O PDF do Relatório técnico (#32): as mesmas bibliotecas da imagem do worker.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest

  e2e:
    name: E2E (Playwright + Supabase local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      # Storage entra a partir do ticket #11 (Importação manual).
      - run: supabase start -x realtime,imgproxy,studio,postgres-meta,edge-runtime,logflare,vector,supavisor
      - name: Configurar app web com a stack local
        run: |
          key="$(supabase status -o json | jq -r .PUBLISHABLE_KEY)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$key"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"
          } | tee apps/web/.env.local >> "$GITHUB_ENV"
          # Só para o script que indexa o E2E da Base de conhecimento; fora do .env.local.
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r .SECRET_KEY)" >> "$GITHUB_ENV"
      - run: pnpm --filter @aid/web exec playwright install --with-deps chromium
      - run: pnpm --filter @aid/web test:e2e
      # Na falha, os prints e traces mostram a diferença (inclusive dos snapshots visuais).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: apps/web/test-results
          retention-days: 7
      - name: Emulador do Pub/Sub
        run: |
          docker run -d --name pubsub -p 8085:8085 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=aid-local
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8085/ && exit 0; sleep 2; done
          docker logs pubsub; exit 1
      - name: Testes de integração da API e dos workers
        env:
          INTEGRATION_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_URL: http://127.0.0.1:54321
          PUBSUB_EMULATOR_HOST: 127.0.0.1:8085
        run: |
          SUPABASE_SERVICE_ROLE_KEY="$(supabase status -o json | jq -r .SECRET_KEY)" uv run pytest \
            apps/api/tests/test_api_integration.py \
            apps/api/tests/test_api_isolation.py \
            workers/ingestion/tests/test_ingestion_pipeline.py \
            workers/ingestion/tests/test_ingestion_storage.py \
            workers/relay/tests/test_relay.py \
            workers/connectors/tests/test_connector_sync.py \
            workers/correlation/tests/test_correlation_worker.py \
            workers/diagnosis/tests/test_rules_worker.py \
            workers/diagnosis/tests/test_diagnose.py \
            workers/diagnosis/tests/test_retention.py \
            workers/diagnosis/tests/test_quotas.py \
            workers/diagnosis/tests/test_report.py \
            packages/knowledge/tests/test_knowledge_db.py

  terraform:
    name: Terraform (fmt, validate, tflint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - uses: terraform-linters/setup-tflint@v5
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=stack init -backend=false -input=false
      - run: terraform -chdir=stack validate
      - run: tflint --recursive --config="$PWD/.tflint.hcl"
      - run: terraform -chdir=stack test

  images:
    name: Imagens Docker
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { package: aid-api, app: "aid_api.main:app", system: "" }
          - {
              package: aid-worker,
              app: "aid_worker.main:app",
              system: "libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core",
            }
    steps:
      - uses: actions/checkout@v5
      - run: >-
          docker build -f infrastructure/docker/python.Dockerfile
          --build-arg PACKAGE=${{ matrix.package }} --build-arg APP=${{ matrix.app }}
          --build-arg SYSTEM_PACKAGES="${{ matrix.system }}" .

  contracts:
    name: Contratos gerados atualizados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      - run: make contracts
      - name: Falhar se o gerado divergir do commitado
        run: git diff --exit-code -- packages/contracts

  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.8
    steps:
      - uses: actions/checkout@v5
      - name: Instalar actionlint
        run: |
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint
      - name: Validar workflows (inclui shellcheck dos run)
        run: actionlint -color

  secrets:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Instalar gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Varrer histórico
        run: gitleaks git --redact --verbose --config .gitleaks.toml .

  database:
    name: Banco (supabase db lint + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verificar projeto Supabase
        id: supabase
        run: echo "present=$([ -f supabase/config.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.supabase.outputs.present == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: latest
      - if: steps.supabase.outputs.present == 'true'
        run: supabase db start
      - if: steps.supabase.outputs.present == 'true'
        run: supabase db lint --schema doctor --fail-on warning
      - if: steps.supabase.outputs.present == 'true'
        run: supabase test db
      - if: steps.supabase.outputs.present != 'true'
        run: |
          echo "Sem supabase/config.toml ainda (chega no ticket #2); job ignorado."
