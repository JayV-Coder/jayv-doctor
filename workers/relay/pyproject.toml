[project]
name = "aid-relay"
version = "0.0.0"
description = "Relay da outbox: publica no Pub/Sub as mensagens gravadas na transação do dado"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10"]
build-backend = "uv_build"
